# Builds everything multitrack needs for MPC OS, without installing anything on your own computer:
#   1. the addin (libmpc_usb_audio.so, armv7) in an install zip, set up for 27 channels
#   2. the "USB Out" plugin, built with Akai's official MPC Plugin SDK (arm32 + arm64)
# Run it from the Actions tab ("Multitrack build" > Run workflow). The result is a download
# ("multitrack-build") at the bottom of the finished run.
name: Multitrack build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the kit as a public GitHub Release (a permanent download link)
        type: boolean
        default: false
  push:
    paths: [ "src/**", "plugin/**", "etc/**", "tools/**", ".github/workflows/multitrack.yml" ]

env:
  VERSION: 1.3.1

# contents: write lets "Publish release" below create the release; nothing else writes.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: mpc-addin-usb-audio }
      # The shared addin installer, pinned like test.yml and release.yml.
      - uses: actions/checkout@v4
        with:
          repository: open-mpc/mpc-vst-plugins
          ref: dbe1f2b08eef98213611bd9ff6d9e9437d350d95
          path: mpc-vst-plugins
      # Akai's MPC Plugin SDK (MPC OS 3.10.1 and later).
      - uses: actions/checkout@v4
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          path: mpc-plugin-builder-sdk
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm }

      - name: Offline tests
        working-directory: mpc-addin-usb-audio
        run: |
          sudo sysctl -q vm.mmap_rnd_bits=28
          tools/test_host.sh 2>&1 | grep -v "^FAIL installer" | tee /tmp/tests.txt
          ! grep -q "^FAIL" /tmp/tests.txt

      - name: Addin for MPC OS (armv7)
        working-directory: mpc-addin-usb-audio
        run: |
          tools/build_armhf.sh
          cp etc/usbaudio-multitrack.conf build/package/usbaudio.conf
          tools/release.sh "$VERSION"

      - name: USB Out plugin (Akai SDK)
        working-directory: mpc-plugin-builder-sdk
        run: |
          cp -r ../mpc-addin-usb-audio/plugin/UsbOut plugins/UsbOut
          python tools/build.py plugins/UsbOut
          python tools/package.py plugins/UsbOut --out ../out

      - name: Collect
        run: |
          mkdir -p out
          cp mpc-addin-usb-audio/dist/*.zip out/
          cp mpc-addin-usb-audio/docs/MULTITRACK.md out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: multitrack-build
          path: out/

      # The share-ready kit: README.txt, LICENSES.txt and the "multitrack" folder that goes on the
      # MPC's SD card or USB stick (installer, addin zip, plugin folder).
      - name: Kit
        run: |
          K=kit/MPC-Multitrack-Kit
          M="$K/multitrack"
          mkdir -p "$M" /tmp/plugin
          cp mpc-addin-usb-audio/kit/README.txt mpc-addin-usb-audio/kit/LICENSES.txt "$K/"
          cp mpc-addin-usb-audio/kit/multitrack/install.sh mpc-addin-usb-audio/kit/multitrack/uninstall.sh "$M/"
          cp mpc-addin-usb-audio/dist/MPC-USB-audio-addin-*-mpc-armv7.zip "$M/"
          unzip -q out/usb-out-*-mpc.zip -d /tmp/plugin
          cp -r "/tmp/plugin/MPC USB Audio - VST - USB Out" "$M/"
          test -f "$M/MPC USB Audio - VST - USB Out/plugin.json"
          test -f "$M/install.sh"
          ls -1 "$M"/MPC-USB-audio-addin-*-mpc-armv7.zip
          find kit -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Multitrack-Kit
          path: kit/

      # Only on a manual run with "publish" ticked: the kit, zipped, as a public release.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd kit && zip -qr "../MPC-Multitrack-Kit-$VERSION.zip" MPC-Multitrack-Kit)
          gh release delete "multitrack-v$VERSION" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "multitrack-v$VERSION" "MPC-Multitrack-Kit-$VERSION.zip" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "MPC Multitrack Kit $VERSION" \
            --notes-file mpc-addin-usb-audio/kit/RELEASE_NOTES.md
