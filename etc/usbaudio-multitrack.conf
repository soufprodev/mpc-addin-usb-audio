# Multitrack settings: the MPC's main mix on USB channels 1-2, and 25 more channels (3-27) for the
# USB Out plugin. Put "USB Out" on a track, pad or bus and pick its USB channel; in the DAW, record
# that channel. See docs/MULTITRACK.md. Every other setting is as in usbaudio.conf.example.
enabled=1
to_host=out1,out2,send1-25
host_channels=2
to_mpc_in=host1,host2
input_mode=sum
# 24-bit on USB: the MPC's converters are 24-bit, and it keeps USB packets small.
sample_bytes=3
